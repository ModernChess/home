<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Chess Hub</title>
    <!-- Linked to style.css as requested -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container" style="max-width: 800px;">
        <!-- Header / Navigation (Plus badge removed) -->
        <header>
            <div style="display: flex; align-items: center; gap: 12px;">
                <img src="https://raw.githubusercontent.com/ModernChess/assets-images/main/mchess.png" alt="Modern Chess" style="height: 38px; vertical-align: middle; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5);">
            </div>
        </header>

        <!-- Main Content Area -->
        <main>
            <section id="home-section" class="tab-content active">
                <div class="welcome-box">
                    <h2 id="homeWelcomeTitle">Welcome, Player!</h2>
                    <p>Choose your mode, explore gameplay variants, manage your collection, or enter the matchmaking arena.</p>
                    
                    <!-- Designated Game Links & Store Link -->
                    <div class="cta-buttons">
                        <a href="game.html" class="btn primary-btn" style="background: var(--secondary-gradient); color: #121214; font-weight: 700;">Enter Matchmaking Arena</a>
                        <a href="shop.html" class="btn primary-btn" style="background: var(--primary-gradient); color: #fff; font-weight: 700;">Buy Game Boards (New Store)</a>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Modern Chess. Powered by GitHub & Firebase.</p>
        </footer>
    </div>

    <!-- Advanced Floating Logger System Integration -->
    <script type="module" src="logger.js"></script>

    <!-- Session Script with Custom Image & Emoji Avatar Support -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('arena_chess_user');
            const savedAvatar = localStorage.getItem('arena_chess_avatar') || '😀';
            const welcomeTitle = document.getElementById('homeWelcomeTitle');

            if (savedUser && welcomeTitle) {
                const avatarHTML = (savedAvatar.startsWith('data:image/') || savedAvatar.startsWith('http'))
                    ? `<img src="${savedAvatar}" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 4px;">`
                    : `<span style="vertical-align: middle; margin-right: 2px;">${savedAvatar}</span>`;

                welcomeTitle.innerHTML = `Welcome, ${avatarHTML} ${savedUser}!`;
            }
        });
    </script>
</body>
</html>
